name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
    tags-ignore:
      - '*beta*'
      - '*alpha*'
      - '*rc*'
      - '*-*'              # 排除所有预发布版本

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 从 tag 提取版本号，写入 package.json
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 去掉 v 前缀（如果有的话）
          VERSION="${TAG#v}"

          # 校验版本号格式
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: $VERSION (expected: X.Y.Z)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

          # 写入 package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run --if-present test:run
        continue-on-error: true   # 测试不阻塞发布，按需调整

      - name: Build
        run: npm run build

      - name: Publish to npm (latest)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 从 git log 生成 changelog
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 找到上一个 tag（排除 beta/alpha/rc）
          PREV_TAG=$(git tag --sort=-v:refname | grep -vE 'beta|alpha|rc' | grep -v "^${GITHUB_REF_NAME}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Install" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "npm i -g nuwax-file-server@${VERSION}" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

          # 输出给后续 step 使用
          {
            echo 'body<<EOF'
            cat CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nuwax-file-server v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **npm:** nuwax-file-server@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **tag:** ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "npm i -g nuwax-file-server@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
